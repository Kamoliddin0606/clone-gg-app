name: Release APK v0.0.4

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  build-others:
    name: Build Other Architectures APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (armeabi-v7a, x86_64)
        run: flutter build apk --release --target-platform android-arm,android-x64 --split-per-abi

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

  release:
    name: Create GitHub Release
    needs: [build-arm64, build-others]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Rename APKs
        run: |
          mv apks/app-arm64-v8a-release.apk apks/selup-v0.0.4-arm64-v8a.apk
          mv apks/app-armeabi-v7a-release.apk apks/selup-v0.0.4-armeabi-v7a.apk
          mv apks/app-x86_64-release.apk apks/selup-v0.0.4-x86_64.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.4
          name: SelUp v0.0.4
          body: |
            ## SelUp v0.0.4

            ### Downloads
            - **selup-v0.0.4-arm64-v8a.apk** — ARM64 qurilmalar uchun (zamonaviy telefonlar)
            - **selup-v0.0.4-armeabi-v7a.apk** — ARMv7 qurilmalar uchun (eski telefonlar)
            - **selup-v0.0.4-x86_64.apk** — x86_64 qurilmalar uchun (emulatorlar)
          files: apks/*.apk
          generate_release_notes: true
