servers:
- url: http://localhost:8000
  description: Development server
- url: http://178.218.200.120:1596
  description: Production server
tags:
- name: Authentication
  description: 'JWT token olish, yangilash va tekshirish endpointlari. Access tokenni
    `Authorization: Bearer` header ida yuboring.'
- name: Projects
  description: Project CRUD operatsiyalari va rasm boshqaruvi (list, search, create,
    update, delete, bulk image upload).
- name: Clients
  description: Client CRUD operatsiyalari, faqat autentifikatsiya qilingan foydalanuvchilar
    uchun. Rasm boshqaruvi va bulk upload misollari.
- name: Nomenklatura
  description: Nomenklatura CRUD operatsiyalari, rasm yuklash va katalogni boshqarish.
- name: Integration
  description: 1C tizimi bilan sinxronizatsiya, background sync jarayonlari va progress
    status endpointlari.
- name: Agent Locations
  description: Mobil agentlar tomonidan yuborilgan geolokatsiya yozuvlari. Qurilma,
    lokatsiya, tarmoq, sensor va boshqa ma'lumotlar bilan birga saqlanadi. Barcha
    maydonlar ixtiyoriy (faqat agent_code, latitude, longitude majburiy).
