      summary: Project uchun bir nechta rasm yuklash
      tags:
      - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectImageBulkUploadRequest'
            examples:
              MultipartSample:
                value: http --form POST /api/v1/project-images/bulk-upload/ project=P-001
                  category=marketing note='Banner versiyasi' images@/path/to/image1.jpg
                  images@/path/to/image2.jpg
                summary: Multipart sample
                description: HTTPie yordamida bir nechta rasm yuborish
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectImageBulkUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectImageBulkUploadRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectImageList'
              examples:
                MultipartSample:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - http --form POST /api/v1/project-images/bulk-upload/ project=P-001
                      category=marketing note='Banner versiyasi' images@/path/to/image1.jpg
                      images@/path/to/image2.jpg
                  summary: Multipart sample
                  description: HTTPie yordamida bir nechta rasm yuborish
          description: Yangi yuklangan rasmlar ro'yxati
        '400':
          description: Kerakli maydonlar yetishmaydi
        '404':
          description: Project topilmadi
