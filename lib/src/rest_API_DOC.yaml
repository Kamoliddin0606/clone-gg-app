openapi: 3.0.3
info:
  title: E-Catalog API
  version: 1.0.0
  description: "\n# E-Catalog Microservice API Documentation\n\nBu API Project, Nomenklatura
    va Client ma'lumotlarini boshqarish uchun yaratilgan Django REST Framework asosidagi
    microservice.\n\n## Asosiy Xususiyatlar\n\n- **Project Management** — Project'lar
    va ularning rasmlarini boshqarish\n- **Nomenklatura Management** — Nomenklatura'lar
    va ularning rasmlarini boshqarish\n- **Client Management** — Client'lar va ularning
    rasmlarini boshqarish (Authentication talab qilinadi)\n- **Agent Locations** —
    Mobil agentlar tomonidan yuborilgan geolokatsiya va qurilma ma'lumotlari\n- **1C
    Integration** — 1C dan ma'lumotlarni yuklab olish\n- **Image Processing** — Rasmlarni
    turli o'lchamlarda (sm, md, lg, thumbnail) saqlash\n- **JWT Authentication** —
    Token-based authentication\n- **Pagination** — Sahifalash bilan ma'lumotlarni
    olish\n- **Search & Filtering** — Qidirish va filtrlash imkoniyatlari\n\n## Authentication\n\n1.
    `POST /api/token/` — `username` va `password` yuboring. Javobda `access` va `refresh`
    token olasiz.\n2. `Authorization: Bearer <access_token>` header'ini barcha himoyalangan
    endpointlarda yuboring.\n3. `POST /api/token/refresh/` — `refresh` token yuborib
    yangi `access` token oling.\n4. `POST /api/token/verify/` — mavjud tokenning yaroqliligini
    tekshiring.\n\n> Test uchun: `http POST http://localhost:8000/api/token/ username=admin
    password=secret`\n\n## Projects\n\n- `GET /api/v1/project/` — `search`, `code_1c`,
    `name`, `page`, `page_size` parametrlari mavjud.\n- `POST /api/v1/project/` —
    yangi project yaratish (`code_1c`, `name`, `title`, `description`, `is_active`).\n-
    `PUT/PATCH/DELETE /api/v1/project/{code_1c}/` — mavjud projectni yangilash yoki
    soft-delete qilish.\n- Rasmlar:\n  - `POST /api/v1/project-images/` — bitta rasm
    (`multipart/form-data`).\n  - `POST /api/v1/project-images/bulk-upload/` — `project=<code>`
    va bir nechta `images[]`.\n\n## Clients\n\n- Barcha client endpointlari JWT authentication
    talab qiladi.\n- `GET /api/v1/client/` — `search`, `client_code_1c`, `name`, `page`,
    `page_size`.\n- `POST /api/v1/client/` va `PUT/PATCH/DELETE /api/v1/client/{client_code_1c}/`.\n-
    Rasmlar:\n  - `POST /api/v1/client-images/`\n  - `POST /api/v1/client-images/bulk-upload/`
    — `client=<code>` va `images[]`.\n\n## Nomenklatura\n\n- `GET /api/v1/nomenklatura/`
    — `search`, `code_1c`, `name`, `page`, `page_size`.\n- `POST /api/v1/nomenklatura/`
    va `PUT/PATCH/DELETE /api/v1/nomenklatura/{code_1c}/`.\n- Rasmlar:\n  - `POST
    /api/v1/nomenklatura-images/`\n  - `POST /api/v1/nomenklatura-images/bulk-upload/`
    — `nomenklatura=<code>` va `images[]`.\n\n## Agent Locations\n\n- `GET /api/v1/agent-locations/`
    — Agent lokatsiya yozuvlari ro'yxati (JWT talab qilinadi).\n  - Filterlar: `agent_code`,
    `region`, `platform`, `device_id`, `date_from`, `date_to`\n- `POST /api/v1/agent-locations/`
    — Yangi lokatsiya yozuvini yaratish.\n- `GET /api/v1/agent-locations/{id}/` —
    Bitta yozuvni olish.\n- `PUT/PATCH /api/v1/agent-locations/{id}/` — Yozuvni yangilash.\n-
    `DELETE /api/v1/agent-locations/{id}/` — Soft-delete qilish.\n\n### AgentLocation
    maydonlari (barcha ixtiyoriy, faqat `agent_code`, `latitude`, `longitude` majburiy)\n\n####
    Agent ma'lumotlari\n- `agent_code` *(string, required)* — Agent kodi\n- `agent_name`
    *(string, optional)* — Agent ismi\n- `agent_phone` *(string, optional)* — Agent
    telefoni\n- `region` *(string, optional)* — Hudud yoki filial\n\n#### Qurilma
    ma'lumotlari\n- `device_id` *(string, optional)* — Qurilma ID (IMEI/UUID)\n- `device_name`
    *(string, optional)* — Qurilma nomi\n- `device_manufacturer` *(string, optional)*
    — Ishlab chiqaruvchi (Samsung, Apple, etc.)\n- `device_model` *(string, optional)*
    — Qurilma modeli\n- `platform` *(string, optional)* — OS (Android/iOS)\n- `os_version`
    *(string, optional)* — OS versiyasi\n- `screen_width`, `screen_height` *(integer,
    optional)* — Ekran o'lchamlari (px)\n- `screen_density` *(decimal, optional)*
    — Ekran zichligi (DPI)\n- `ram_total`, `ram_available` *(bigint, optional)* —
    RAM (byte)\n- `storage_total`, `storage_available` *(bigint, optional)* — Xotira
    (byte)\n- `camera_front`, `camera_back` *(boolean, optional)* — Kamera mavjudligi\n-
    `camera_resolution` *(string, optional)* — Kamera o'lchami\n\n#### Ilova ma'lumotlari\n-
    `app_version` *(string, optional)* — Ilova versiyasi\n- `app_build_number` *(string,
    optional)* — Build raqami\n- `app_installation_date` *(datetime, optional)* —
    O'rnatilgan sana\n- `app_last_update` *(datetime, optional)* — Oxirgi yangilanish\n\n####
    Lokatsiya ma'lumotlari\n- `latitude` *(decimal, required)* — Latitude (WGS84)\n-
    `longitude` *(decimal, required)* — Longitude (WGS84)\n- `accuracy` *(decimal,
    optional)* — Aniqlik (metr)\n- `altitude` *(decimal, optional)* — Balandlik (m)\n-
    `speed` *(decimal, optional)* — Tezlik (m/s)\n- `heading` *(decimal, optional)*
    — Yo'nalish (gradus)\n- `city` *(string, optional)* — Shahar\n- `country` *(string,
    optional)* — Davlat\n- `postal_code` *(string, optional)* — Pochta indeksi\n-
    `timezone` *(string, optional)* — Vaqt mintaqasi\n- `location_provider` *(string,
    optional)* — Lokatsiya manbasi (GPS, Network, Passive)\n- `address` *(string,
    optional)* — Geo reverse address\n\n#### Batareya ma'lumotlari\n- `battery_level`
    *(decimal, optional)* — Batareya foizi (%)\n- `is_charging` *(boolean, optional)*
    — Zaryadlanayaptimi\n- `battery_health` *(string, optional)* — Batareya holati
    (Good, Fair, Poor)\n- `battery_temperature` *(decimal, optional)* — Batareya harorati
    (°C)\n- `battery_voltage` *(decimal, optional)* — Batareya kuchlanishi (V)\n\n####
    Tarmoq ma'lumotlari\n- `signal_strength` *(string, optional)* — Signal kuchi\n-
    `network_type` *(string, optional)* — Tarmoq turi (WiFi, 4G, 5G, LTE)\n- `wifi_ssid`
    *(string, optional)* — WiFi tarmoq nomi\n- `wifi_bssid` *(string, optional)* —
    WiFi BSSID (MAC)\n- `cellular_operator` *(string, optional)* — Mobil operator\n-
    `cellular_network_type` *(string, optional)* — Mobil tarmoq turi (GSM, CDMA, LTE)\n-
    `ip_address` *(IP, optional)* — IP manzil\n- `connection_type` *(string, optional)*
    — Ulanish turi (WiFi, Mobile, Ethernet)\n\n#### Sensor ma'lumotlari\n- `accelerometer_x`,
    `accelerometer_y`, `accelerometer_z` *(decimal, optional)* — Accelerometer (m/s²)\n-
    `gyroscope_x`, `gyroscope_y`, `gyroscope_z` *(decimal, optional)* — Gyroscope
    (rad/s)\n- `magnetometer_x`, `magnetometer_y`, `magnetometer_z` *(decimal, optional)*
    — Magnetometer (μT)\n- `proximity_sensor` *(decimal, optional)* — Proximity sensor
    (cm)\n- `light_sensor` *(decimal, optional)* — Yorug'lik sensori (lux)\n\n####
    Atrof-muhit ma'lumotlari\n- `temperature` *(decimal, optional)* — Harorat (°C)\n-
    `humidity` *(decimal, optional)* — Namlik (%)\n- `pressure` *(decimal, optional)*
    — Bosim (hPa)\n\n#### Xavfsizlik ma'lumotlari\n- `device_fingerprint` *(string,
    optional)* — Qurilma fingerprint (hash)\n- `is_rooted` *(boolean, optional)* —
    Root qilinganmi\n- `is_jailbroken` *(boolean, optional)* — Jailbreak qilinganmi
    (iOS)\n- `encryption_enabled` *(boolean, optional)* — Shifrlash yoqilganmi\n-
    `screen_lock_type` *(string, optional)* — Ekran qulfi turi (None, PIN, Pattern,
    Fingerprint, Face)\n\n#### Qo'shimcha\n- `logged_at` *(datetime, optional)* —
    Qurilmada yozilgan vaqt\n- `note` *(text, optional)* — Izoh\n- `metadata` *(JSON,
    optional)* — Qo'shimcha JSON ma'lumotlar\n\n## Integration\n\n- `GET /api/v1/integration/`
    — Integration sozlamalari ro'yxati (JWT talab qilinadi).\n- `POST /api/v1/integration/{id}/sync-nomenklatura/`
    — 1C dan nomenklatura ma'lumotlarini fon rejimida yuklashni boshlaydi.\n- `POST
    /api/v1/integration/{id}/sync-clients/` — 1C dan client ma'lumotlarini yuklaydi.\n-
    `GET /api/v1/integration/sync-status/{task_id}/` — fon jarayonining progressini
    kuzatish.\n- Sync javobidagi `task_id` orqali status endpointiga murojaat qiling
    (`status`: `fetching`, `processing`, `completed`, `error`).\n\n### 1C Integration
    Sozlamalari\n\nIntegration sozlamasini yaratish uchun quyidagi maydonlar kerak
    (`IntegrationSerializer`):\n\n| Field | Type | Description |\n|-------|------|-------------|\n|
    `name` | string | Integration nomi (unikal) |\n| `project` | integer | Project
    ID (ForeignKey) |\n| `wsdl_url` | string (URL) | 1C web-service WSDL manzili |\n|
    `method_nomenklatura` | string | 1C dagi nomenklaturani qaytaruvchi method nomi
    |\n| `method_clients` | string | 1C dagi clientlarni qaytaruvchi method nomi |\n|
    `chunk_size` | integer | Bir qo‘ng‘iroqda qayta ishlanadigan elementlar soni |\n|
    `description` | rich text | Integration haqida qo‘shimcha ma’lumot |\n\n### 1C
    → E-Catalog ma'lumot mapping'i\n\n#### Nomenklatura itemi (`sync-nomenklatura`
    uchun)\n\n1C dan keladigan obyekt quyidagi atributlarni o‘z ichiga olishi kerak:\n\n-
    `Code` *(string, required)* → `code_1c`\n- `Name` *(string, required)* → `name`\n-
    `Title` *(string, optional)* → `title`\n- `Description` *(string/RichText, optional)*
    → `description`\n- `Project` *(string, optional)* → Project nomi. Agar berilmasa,
    integration bilan biriktirilgan project ishlatiladi.\n- `Images` *(list, optional)*
    → Rasm URL yoki fayl manzillari. Har bir elementda quyidagi kichik maydonlar bo‘lishi
    mumkin:\n  - `Image` / `image` — original fayl URL\n  - `ImageSm` / `image_sm`
    — kichik o‘lcham\n  - `ImageMd` / `image_md` — o‘rta o‘lcham\n  - `ImageLg` /
    `image_lg` — katta o‘lcham\n  - `IsMain` / `is_main` — asosiy rasm flagi\n\n####
    Client itemi (`sync-clients` uchun)\n\n- `Code` *(string, required)* → `client_code_1c`\n-
    `Name` *(string, required)* → `name`\n- `Email` *(string, optional)* → `email`\n-
    `Phone` *(string, optional)* → `phone`\n- `Description` *(string, optional)* →
    `description`\n- `Images` *(list, optional)* → Project ga o‘xshash strukturadagi
    rasm ma’lumotlari\n\n#### Integration log statuslari\n\n- `fetching` — 1C dan
    ma’lumotlar olinmoqda\n- `processing` — ma’lumotlar bazaga yozilmoqda\n- `completed`
    — jarayon muvaffaqiyatli yakunlandi\n- `error` — xatolik yuz berdi (`error_message`
    maydonida tafsilotlar qaytadi)\n\n## Image Formats\n\n- **image_url** — Original
    rasm\n- **image_sm_url** — Kichik (300x300px) — mobil qurilmalar uchun\n- **image_md_url**
    — O'rta (600x600px) — planshetlar uchun\n- **image_lg_url** — Katta (1200x1200px)
    — desktop qurilmalar uchun\n- **image_thumbnail_url** — Thumbnail (150x150px)
    — ro'yxatlar uchun\n\n## Pagination\n\n- `page` — Sahifa raqami (default: 1)\n-
    `page_size` — Sahifadagi elementlar soni (default: 20, max: 100)\n\nResponse formati:\n```json\n{\n
    \ \"count\": 100,\n  \"next\": \"http://localhost:8000/api/v1/project/?page=2\",\n
    \ \"previous\": null,\n  \"results\": [...]\n}\n```\n\n## Search & Filtering\n\n-
    `search` — Barcha `search_fields` maydonlarida qidirish\n- `field=value` — Aniq
    maydon bo'yicha filtrlash\n- `ordering=field` — Tartiblash (`-field` — teskari
    tartib)\n\n## Status Management\n\n- `PATCH /api/v1/project/{code_1c}/` — `{\"is_active\":
    false}` yoki `{\"is_deleted\": true}`\n- `PATCH /api/v1/client/{client_code_1c}/`
    — xuddi shunday\n- `PATCH /api/v1/nomenklatura/{code_1c}/` — xuddi shunday\n\n##
    Qo'shimcha Ma'lumotlar\n\n- **Swagger UI**: http://localhost:8000/api/docs/\n-
    **ReDoc**: http://localhost:8000/api/redoc/\n- **OpenAPI Schema**: http://localhost:8000/api/schema/\n
    \   "
paths:
  /api/token/:
    post:
      operationId: api_token_create
      description: 'Foydalanuvchi `username` va `password` ma''lumotlari asosida JWT
        token juftligini qaytaradi. Qaytgan `access` token''ni API so''rovlarida `Authorization:
        Bearer <access_token>` header''i orqali yuboring. `refresh` token esa keyinchalik
        yangi access token olish uchun ishlatiladi.'
      summary: JWT access va refresh token olish
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
            examples:
              CurlMisoli:
                value: 'curl -X POST http://localhost:8000/api/token/ -H "Content-Type:
                  application/json" -d ''{"username": "admin", "password": "secret"}'''
                summary: Curl misoli
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
              examples:
                CurlMisoli:
                  value: 'curl -X POST http://localhost:8000/api/token/ -H "Content-Type:
                    application/json" -d ''{"username": "admin", "password": "secret"}'''
                  summary: Curl misoli
          description: ''
  /api/token/refresh/:
    post:
      operationId: api_token_refresh_create
      description: Oldin olingan refresh token'ni yuborib yangi access token yarating.
        Agar `ROTATE_REFRESH_TOKENS=True` bo'lsa, javobda yangi refresh ham qaytadi.
      summary: Refresh token orqali yangi access token olish
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
            examples:
              HTTPieMisoli:
                value: http POST http://localhost:8000/api/token/refresh/ refresh=<refresh_token>
                summary: HTTPie misoli
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
              examples:
                HTTPieMisoli:
                  value: http POST http://localhost:8000/api/token/refresh/ refresh=<refresh_token>
                  summary: HTTPie misoli
          description: ''
  /api/token/verify/:
    post:
      operationId: api_token_verify_create
      description: JWT tokenning haqiqiyligini tekshiradi. Token noto'g'ri bo'lsa
        401 qaytaradi.
      summary: Access yoki refresh tokenni tekshirish
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/agent-location/:
    get:
      operationId: agent_location_list
      description: Mobil agentlar tomonidan yuborilgan geolokatsiya yozuvlarini qaytaradi.
        Barcha maydonlar ixtiyoriy (majburiy emas). Qurilma, lokatsiya, tarmoq, sensor
        va boshqa ma'lumotlar bilan birga saqlanadi.
      summary: Agent lokatsiya yozuvlari ro'yxati
      parameters:
      - in: query
        name: agent_code
        schema:
          type: string
        description: Agent kodi bo'yicha filter
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
        description: Yaratilgan vaqtdan boshlab
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
        description: Yaratilgan vaqtgacha
      - in: query
        name: device_id
        schema:
          type: string
        description: Qurilma ID bo'yicha filter
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: platform
        schema:
          type: string
        description: Mobil platforma bo'yicha filter (Android/iOS)
      - in: query
        name: region
        schema:
          type: string
        description: Hudud bo'yicha filter
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Agent Locations
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgentLocationList'
          description: ''
    post:
      operationId: agent_location_create
      description: 'Mobil agent ilovasi lokatsiya ma''lumotlarini yuboradi. Barcha
        maydonlar ixtiyoriy, faqat `agent_code`, `latitude` va `longitude` majburiy.
        Qo''shimcha ma''lumotlar: qurilma (manufacturer, model, RAM, storage, camera),
        lokatsiya (city, country, timezone), tarmoq (WiFi, cellular, IP), sensorlar
        (accelerometer, gyroscope, magnetometer), batareya (level, health, temperature),
        xavfsizlik (fingerprint, encryption, screen lock) va boshqalar.'
      summary: Agent lokatsiyasini yaratish
      tags:
      - Agent Locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentLocationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentLocationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentLocationCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLocation'
          description: ''
  /api/v1/agent-location/{id}/:
    get:
      operationId: agent_location_retrieve
      description: Barcha maydonlar bilan birga lokatsiya yozuvini qaytaradi.
      summary: Bitta lokatsiya yozuvini olish
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Agent Location.
        required: true
      tags:
      - Agent Locations
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLocation'
          description: ''
    put:
      operationId: agent_location_update
      summary: Lokatsiya yozuvini to'liq yangilash
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Agent Location.
        required: true
      tags:
      - Agent Locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentLocationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentLocationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentLocationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLocation'
          description: ''
    patch:
      operationId: agent_location_partial_update
      summary: Lokatsiya yozuvini qisman yangilash
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Agent Location.
        required: true
      tags:
      - Agent Locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAgentLocationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAgentLocationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAgentLocationRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLocation'
          description: ''
    delete:
      operationId: agent_location_destroy
      summary: Lokatsiya yozuvini soft-delete qilish
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Agent Location.
        required: true
      tags:
      - Agent Locations
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/client/:
    get:
      operationId: client_list
      description: Authentication talab qilinadi. Client'lar ro'yxatini pagination
        bilan qaytaradi. `search` parametri orqali `name`, `email` va `client_code_1c`
        bo'yicha qidirish mumkin.
      summary: Client ro'yxatini olish
      parameters:
      - in: query
        name: client_code_1c
        schema:
          type: string
        description: Aniq code bo'yicha filter
      - in: query
        name: created_from
        schema:
          type: string
          format: date
        description: Yaratilgan sanadan boshlab (YYYY-MM-DD)
      - in: query
        name: created_to
        schema:
          type: string
          format: date
        description: Yaratilgan sana chegarasi (YYYY-MM-DD)
      - in: query
        name: description_status
        schema:
          type: string
        description: Description bo'yicha filter (`with` | `without`)
      - in: query
        name: email
        schema:
          type: string
      - in: query
        name: image_status
        schema:
          type: string
        description: Rasm holati bo'yicha filter (`with` - rasm bor | `without` -
          rasm yo'q)
      - in: query
        name: name
        schema:
          type: string
