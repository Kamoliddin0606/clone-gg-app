components:
  schemas:
    AgentLocation:
      type: object
      description: AgentLocation serializer - barcha maydonlar ixtiyoriy
      properties:
        id:
          type: integer
          readOnly: true
        is_active:
          type: boolean
        is_deleted:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        agent_code:
          type: string
          description: Agentni identifikatsiya qilish uchun code (unikal emas, lekin
            tez-tez ishlatiladi)
          maxLength: 100
        agent_name:
          type: string
          description: Agent to'liq ismi
          maxLength: 150
        agent_phone:
          type: string
          description: Aloqa telefoni
          maxLength: 50
        region:
          type: string
          description: Hudud yoki filial nomi
          maxLength: 120
        device_id:
          type: string
          description: Qurilma ID (IMEI yoki UUID)
          maxLength: 120
        device_name:
          type: string
          description: Qurilma nomi/modeli
          maxLength: 120
        device_manufacturer:
          type: string
          description: Ishlab chiqaruvchi (Samsung, Apple, Xiaomi, etc.)
          maxLength: 100
        device_model:
          type: string
          description: Qurilma modeli (SM-G991B, iPhone 13, etc.)
          maxLength: 100
        platform:
          type: string
          description: Operatsion tizim (Android/iOS)
          maxLength: 50
        os_version:
          type: string
          description: OS versiyasi (Android 12, iOS 15.0, etc.)
          maxLength: 50
        screen_width:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          description: Ekran kengligi (pixel)
        screen_height:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          description: Ekran balandligi (pixel)
        screen_density:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Ekran zichligi (DPI)
        ram_total:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          description: Jami RAM (byte)
        ram_available:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          description: Mavjud RAM (byte)
        storage_total:
