    get:
      operationId: thumbnails_retrieve
      description: Project, Client va Nomenklatura rasmlarining faqat thumbnail URL
        larini qaytaradi. Har bir element entity haqida identifikatsion ma'lumotlar
        (ID, code, nom) bilan birga keladi. Endpoint mobil yoki frontend ilovasi uchun
        tezkor rasm previewlarini olishga mo'ljallangan.
      summary: Birlashtirilgan thumbnail feed
      parameters:
      - in: query
        name: entity_type
        schema:
          type: string
        description: 'Filtrlash uchun entity turlari (virgullar bilan ajratilgan).
          Ruxsat etilgan qiymatlar: project, client, nomenklatura. Default: hammasi.'
      - in: query
        name: is_main
        schema:
          type: boolean
        description: Faqat asosiy (true) yoki oddiy (false) rasmlarni qaytarish
      - in: query
        name: limit
        schema:
          type: integer
        description: 'Qaytariladigan maksimal elementlar soni (default: 60, max: 200)'
      - in: query
        name: status
        schema:
          type: string
        description: 'ImageStatus kodi bo''yicha filter (masalan: store_before)'
      tags:
      - Image Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThumbnailEntry'
          description: Thumbnail feed ma'lumotlari
